services:
  docmost:
    build: .
    image: docmost-fork:local
    depends_on:
      - db
      - redis
    environment:
      APP_URL: '${APP_URL:?APP_URL is required}'
      APP_SECRET: '${APP_SECRET:?APP_SECRET is required}'
      DATABASE_URL: 'postgresql://docmost:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/docmost'
      REDIS_URL: 'redis://redis:6379'
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3000:3000"
    restart: unless-stopped
    volumes:
      - docmost:/app/data/storage

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: '${DB_PASSWORD:?DB_PASSWORD is required}'
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  docmost:
  db_data:
  redis_data:
